<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Arif Digital</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../config.js"></script>
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#171717;--border:#262626;--accent:#ff6a13;--accent2:#ff8534;--soft:rgba(255,106,19,.12);--muted:#a3a3a3;--dim:#737373;--ok:#22c55e;--err:#f87171;--side:236px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
i[data-lucide]{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px;background:var(--accent);color:#fff;transition:background .2s,transform .2s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border-color:var(--border);color:#e5e5e5}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;border-color:rgba(248,113,113,.4);color:var(--err)}.btn.danger:hover{background:rgba(248,113,113,.1)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.field,select.field,textarea.field{width:100%;background:#0f0f0f;border:1px solid var(--border);border-radius:8px;color:#fff;padding:10px 12px;font:inherit}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{min-height:96px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 70% 20%,rgba(255,106,19,.14),transparent 60%),var(--bg)}
.lbox{width:100%;max-width:400px;padding:30px;backdrop-filter:blur(14px);background:rgba(17,17,17,.8)}
.lbox h1{font-size:22px;margin:14px 0 4px}.lbox p.s{color:var(--muted);margin-bottom:20px}
.lbox .row{margin-bottom:14px}
.lnk{background:none;border:none;color:var(--accent);font-size:13px;padding:4px 0}
.msg{font-size:13px;min-height:20px;margin-top:10px}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}

/* shell */
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
aside .brand{display:flex;gap:10px;align-items:center;font-weight:800;padding:4px 8px 16px}
aside .brand img{width:30px;height:30px;border-radius:8px}aside .brand b{color:var(--accent)}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);background:none;border:none;text-align:left;font-size:13px;font-weight:500;width:100%}
.nv:hover{background:var(--surface2);color:#fff}.nv.on{background:var(--soft);color:var(--accent)}
.nv .bd{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.sep{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 12px 4px;font-weight:700}
main{margin-left:var(--side);padding:28px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:22px}.top .who{color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}
.tblw{overflow-x:auto}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;max-width:340px}
.tbl tr:last-child td{border-bottom:none}
.tbl td.act{white-space:nowrap;text-align:right}.tbl td.act .btn{margin-left:6px}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}.pill.warn{color:var(--accent);border-color:rgba(255,106,19,.4)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{padding:18px}.kpi small{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:30px;margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
.thumbp{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--border);margin-top:8px;background:#0f0f0f}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:32px 14px;overflow-y:auto}
.overlay.open{display:flex}
.dlg{width:100%;max-width:640px;padding:24px;background:rgba(17,17,17,.96)}
.dlg h3{font-size:18px;margin-bottom:16px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:var(--surface2);border:1px solid var(--border);padding:12px 16px;border-radius:10px;max-width:320px;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:none;opacity:1}.toast.ok{border-color:rgba(34,197,94,.5)}.toast.err{border-color:rgba(248,113,113,.5)}
#bnav{display:none}
@media (max-width:860px){
  aside{display:none}main{margin-left:0;padding:18px 14px 96px}
  .kpis{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}
  #bnav{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:rgba(17,17,17,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:6px;justify-content:space-around;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #bnav button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 0;border-radius:12px}
  #bnav button.on{color:var(--accent);background:var(--soft)}
  .tbl td{max-width:200px}
}
</style>
</head>
<body>

<div id="login">
  <div class="card lbox">
    <img src="../assets/icon.svg" width="44" height="44" alt="" style="border-radius:10px">
    <h1 id="lTitle">Masuk Admin</h1>
    <p class="s">Panel pengelola portofolio Arif Digital.</p>
    <form id="lf">
      <div class="row"><label class="l">Email</label><input class="field" type="email" id="lEmail" autocomplete="username" required></div>
      <div class="row" id="lPassRow"><label class="l">Kata sandi</label><input class="field" type="password" id="lPass" autocomplete="current-password" minlength="6" required></div>
      <button class="btn" style="width:100%;justify-content:center" id="lBtn" type="submit">Masuk</button>
      <div class="msg" id="lMsg" role="status"></div>
    </form>
    <div style="display:flex;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap">
      <button class="lnk" id="lToggle" type="button">Belum punya akun admin? Daftar</button>
      <button class="lnk" id="lForgot" type="button">Lupa kata sandi</button>
    </div>
  </div>
</div>

<div id="app">
  <aside id="side"></aside>
  <main>
    <div class="top"><div><h2 id="pTitle"></h2><div class="who" id="who"></div></div><div class="tools" id="pTools"></div></div>
    <div id="view"></div>
  </main>
  <nav id="bnav"></nav>
</div>

<div class="overlay" id="ov"><div class="card dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
const C = window.AD_CONFIG;
const { createClient } = await import(C.SUPABASE_ESM);
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icons = () => window.lucide && lucide.createIcons();
let toastT; const toast = (m, t = 'ok') => { const e = $('#toast'); e.textContent = m; e.className = `toast show ${t}`; clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3200); };
const fmtDate = (d) => d ? new Date(d).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '';

// ===== definisi halaman & CRUD =====
const PAGES = [
  { id: 'dashboard', label: 'Dasbor', icon: 'layout-dashboard', group: 'Umum' },
  { id: 'messages', label: 'Pesan Masuk', icon: 'inbox', group: 'Umum' },
  { id: 'users', label: 'Pengguna Produk', icon: 'users', group: 'Umum' },
  { id: 'products', label: 'Produk', icon: 'package', group: 'Konten' },
  { id: 'profile', label: 'Profil', icon: 'user', group: 'Konten' },
  { id: 'services', label: 'Layanan', icon: 'briefcase', group: 'Konten' },
  { id: 'skills', label: 'Keahlian', icon: 'code-2', group: 'Konten' },
  { id: 'projects', label: 'Proyek', icon: 'folder-kanban', group: 'Konten' },
  { id: 'testimonials', label: 'Testimoni', icon: 'quote', group: 'Konten' },
  { id: 'posts', label: 'Blog', icon: 'newspaper', group: 'Konten' },
  { id: 'stats', label: 'Statistik', icon: 'bar-chart-3', group: 'Konten' },
  { id: 'subscribers', label: 'Newsletter', icon: 'mail', group: 'Lainnya' },
  { id: 'settings', label: 'Pengaturan', icon: 'settings', group: 'Lainnya' }
];
const CRUD = {
  services: { order: ['urutan', true], cols: ['judul', 'deskripsi', 'ikon', 'urutan'], fields: [
    { k: 'judul', l: 'Judul', t: 'text', req: 1 }, { k: 'deskripsi', l: 'Deskripsi', t: 'textarea' },
    { k: 'ikon', l: 'Ikon (nama Lucide)', t: 'text', h: 'Contoh: graduation-cap, globe, sparkles, database. Daftar di lucide.dev/icons' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] },
  skills: { order: ['urutan', true], cols: ['nama', 'ikon', 'urutan'], fields: [
    { k: 'nama', l: 'Nama', t: 'text', req: 1 }, { k: 'ikon', l: 'Ikon (nama Devicon)', t: 'text', h: 'Contoh: html5, javascript, supabase, firebase, github. Daftar di devicon.dev' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] },
  products: { order: ['urutan', true], cols: ['nama', 'status', 'link_demo', 'urutan'], fields: [
    { k: 'nama', l: 'Nama produk', t: 'text', req: 1 }, { k: 'slug', l: 'Slug', t: 'text', req: 1, h: 'Huruf kecil dan tanda hubung, contoh: e-rapor' },
    { k: 'tagline', l: 'Tagline', t: 'text' }, { k: 'deskripsi', l: 'Deskripsi', t: 'textarea' },
    { k: 'fitur', l: 'Fitur (satu per baris)', t: 'lines' }, { k: 'link_demo', l: 'Link aplikasi', t: 'text', h: 'Relatif ke situs, contoh: generator/ atau e-rapor/' },
    { k: 'status', l: 'Status', t: 'select', o: [['segera', 'Segera hadir'], ['aktif', 'Tersedia']] }, { k: 'gambar_url', l: 'Gambar', t: 'image' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] },
  projects: { order: ['urutan', true], cols: ['judul', 'teknologi', 'unggulan', 'urutan'], fields: [
    { k: 'judul', l: 'Judul', t: 'text', req: 1 }, { k: 'deskripsi', l: 'Deskripsi', t: 'textarea' }, { k: 'teknologi', l: 'Teknologi (pisahkan koma)', t: 'tags' },
    { k: 'link', l: 'Link proyek', t: 'text' }, { k: 'gambar_url', l: 'Gambar', t: 'image' }, { k: 'unggulan', l: 'Tampilkan di beranda', t: 'bool' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] },
  testimonials: { order: ['urutan', true], cols: ['nama', 'jabatan', 'isi', 'tampil'], fields: [
    { k: 'nama', l: 'Nama', t: 'text', req: 1 }, { k: 'jabatan', l: 'Jabatan / sekolah', t: 'text' }, { k: 'isi', l: 'Isi testimoni', t: 'textarea', req: 1 },
    { k: 'avatar_url', l: 'Foto', t: 'image' }, { k: 'tampil', l: 'Tampilkan', t: 'bool' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] },
  posts: { order: ['dibuat_pada', false], cols: ['judul', 'terbit', 'dibuat_pada'], fields: [
    { k: 'judul', l: 'Judul', t: 'text', req: 1 }, { k: 'slug', l: 'Slug', t: 'text', req: 1 }, { k: 'ringkasan', l: 'Ringkasan', t: 'textarea' },
    { k: 'isi', l: 'Isi artikel', t: 'textarea', big: 1, h: 'Pisahkan paragraf dengan baris kosong. Awali dengan ### untuk subjudul, atau "- " untuk daftar.' },
    { k: 'cover_url', l: 'Gambar sampul', t: 'image' }, { k: 'terbit', l: 'Terbitkan', t: 'bool' } ] },
  stats: { order: ['urutan', true], cols: ['label', 'nilai', 'ikon', 'urutan'], fields: [
    { k: 'label', l: 'Label', t: 'text', req: 1 }, { k: 'nilai', l: 'Nilai', t: 'text', req: 1, h: 'Contoh: 2, 3+, 100%' }, { k: 'ikon', l: 'Ikon (Lucide)', t: 'text' }, { k: 'urutan', l: 'Urutan', t: 'number' } ] }
};
const COL_LABEL = { judul: 'Judul', deskripsi: 'Deskripsi', ikon: 'Ikon', urutan: 'Urutan', nama: 'Nama', status: 'Status', link_demo: 'Link', teknologi: 'Teknologi', unggulan: 'Beranda', jabatan: 'Jabatan', isi: 'Isi', tampil: 'Tampil', terbit: 'Terbit', dibuat_pada: 'Dibuat', label: 'Label', nilai: 'Nilai' };

// ===== login =====
let mode = 'masuk';
const setMode = (m) => {
  mode = m; $('#lTitle').textContent = m === 'masuk' ? 'Masuk Admin' : 'Daftar Admin';
  $('#lBtn').textContent = m === 'masuk' ? 'Masuk' : 'Daftar'; $('#lToggle').textContent = m === 'masuk' ? 'Belum punya akun admin? Daftar' : 'Sudah punya akun? Masuk'; $('#lMsg').textContent = '';
};
$('#lToggle').onclick = () => setMode(mode === 'masuk' ? 'daftar' : 'masuk');
$('#lForgot').onclick = async () => {
  const email = $('#lEmail').value.trim(); const m = $('#lMsg');
  if (!email) { m.className = 'msg err'; m.textContent = 'Isi email dulu.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
  m.className = error ? 'msg err' : 'msg ok'; m.textContent = error ? error.message : 'Tautan reset dikirim ke email Anda.';
};
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault(); const m = $('#lMsg'); const btn = $('#lBtn'); m.className = 'msg'; m.textContent = '';
  const email = $('#lEmail').value.trim(), pass = $('#lPass').value; btn.disabled = true;
  try {
    if (mode === 'daftar') {
      if (email.toLowerCase() !== C.ADMIN_EMAIL.toLowerCase()) throw new Error('Pendaftaran admin hanya untuk email pemilik situs.');
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error;
      if (data.session) await enter(); else { m.className = 'msg ok'; m.textContent = 'Akun dibuat. Buka email Anda, klik tautan konfirmasi, lalu masuk.'; setMode('masuk'); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw error; await enter();
    }
  } catch (err) { m.className = 'msg err'; m.textContent = err.message === 'Invalid login credentials' ? 'Email atau kata sandi salah.' : err.message; }
  finally { btn.disabled = false; }
});
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') setTimeout(newPassDialog, 200); });
function newPassDialog() {
  openDlg(`<h3>Atur kata sandi baru</h3><label class="l">Kata sandi baru (minimal 8 karakter)</label><input class="field" type="password" id="np" minlength="8"><div class="foot"><button class="btn" id="npOk">Simpan</button></div>`);
  $('#npOk').onclick = async () => { const { error } = await sb.auth.updateUser({ password: $('#np').value }); if (error) return toast(error.message, 'err'); closeDlg(); toast('Kata sandi diperbarui.'); };
}

async function enter() {
  const { data: { session } } = await sb.auth.getSession(); if (!session) return;
  const { data: ok, error } = await sb.rpc('is_admin');
  if (error || !ok) { await sb.auth.signOut(); const m = $('#lMsg'); m.className = 'msg err'; m.textContent = 'Akun ini bukan admin.'; return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  $('#who').textContent = session.user.email; buildNav(); go(location.hash.slice(1) || 'dashboard');
}

// ===== navigasi =====
let current = 'dashboard', unread = 0;
function buildNav() {
  let html = `<div class="brand"><img src="../assets/icon.svg" alt=""><span>ARIF <b>DIGITAL</b></span></div>`; let g = '';
  PAGES.forEach((p) => { if (p.group !== g) { g = p.group; html += `<div class="sep">${g}</div>`; }
    html += `<button class="nv" data-p="${p.id}"><i data-lucide="${p.icon}"></i>${p.label}${p.id === 'messages' && unread ? `<span class="bd">${unread}</span>` : ''}</button>`; });
  html += `<div style="flex:1"></div><a class="nv" href="../" target="_blank" rel="noopener"><i data-lucide="external-link"></i>Lihat situs</a><button class="nv" id="out"><i data-lucide="log-out"></i>Keluar</button>`;
  $('#side').innerHTML = html;
  const quick = ['dashboard', 'messages', 'products', 'users'];
  $('#bnav').innerHTML = quick.map((id) => { const p = PAGES.find((x) => x.id === id); return `<button data-p="${id}"><i data-lucide="${p.icon}"></i>${p.label.split(' ')[0]}</button>`; }).join('') + `<button id="more"><i data-lucide="menu"></i>Menu</button>`;
  document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => go(b.dataset.p));
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('#more').onclick = () => { openDlg(`<h3>Menu</h3><div style="display:grid;gap:6px">${PAGES.map((p) => `<button class="nv" data-go="${p.id}"><i data-lucide="${p.icon}"></i>${p.label}</button>`).join('')}<button class="nv" id="out2"><i data-lucide="log-out"></i>Keluar</button></div>`);
    document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { closeDlg(); go(b.dataset.go); }); $('#out2').onclick = async () => { await sb.auth.signOut(); location.reload(); }; };
  icons(); mark();
}
const mark = () => document.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', b.dataset.p === current));
async function go(id) {
  if (!PAGES.find((p) => p.id === id)) id = 'dashboard'; current = id; location.hash = id; mark();
  const p = PAGES.find((x) => x.id === id); $('#pTitle').textContent = p.label; $('#pTools').innerHTML = ''; $('#view').innerHTML = '<div class="empty">Memuat...</div>';
  try {
    if (id === 'dashboard') await vDash(); else if (id === 'profile') await vProfile(); else if (id === 'messages') await vMessages();
    else if (id === 'subscribers') await vSubs(); else if (id === 'users') await vUsers(); else if (id === 'settings') await vSettings(); else await vCrud(id);
  } catch (e) { $('#view').innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message || e)}</div>`; }
  icons(); scrollTo(0, 0);
}

// ===== dialog =====
function openDlg(html) { $('#dlg').innerHTML = html; $('#ov').classList.add('open'); icons(); }
function closeDlg() { $('#ov').classList.remove('open'); }
$('#ov').addEventListener('mousedown', (e) => { if (e.target.id === 'ov') closeDlg(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDlg(); });
const confirmDlg = (msg) => new Promise((res) => { openDlg(`<h3>Konfirmasi</h3><p style="color:var(--muted)">${esc(msg)}</p><div class="foot"><button class="btn ghost" id="cn">Batal</button><button class="btn danger" id="cy">Ya, lanjutkan</button></div>`); $('#cn').onclick = () => { closeDlg(); res(false); }; $('#cy').onclick = () => { closeDlg(); res(true); }; });

// ===== dasbor =====
async function vDash() {
  const cnt = async (t, f) => { let q = sb.from(t).select('*', { count: 'exact', head: true }); if (f) q = f(q); const { count } = await q; return count ?? 0; };
  const [msg, unr, sub, usr, prod, trial] = await Promise.all([cnt('messages'), cnt('messages', (q) => q.eq('dibaca', false)), cnt('subscribers'), cnt('users'), cnt('products'), cnt('trial_usage')]);
  unread = unr; buildNav();
  $('#view').innerHTML = `<div class="kpis">
    ${[['Pesan masuk', msg, `${unr} belum dibaca`], ['Pelanggan newsletter', sub, ''], ['Pengguna produk', usr, 'akun login'], ['Perangkat uji coba', trial, 'sudah mencoba']].map(([l, v, s]) => `<div class="card kpi"><small>${l}</small><b>${v}</b><small>${s}</small></div>`).join('')}</div>

// ===== form generik =====
function fieldHtml(f, v) {
  const id = `f_${f.k}`; const val = v ?? '';
  const wrap = (inner) => `<div class="${f.t === 'textarea' || f.t === 'lines' || f.t === 'image' ? 'full' : ''}"><label class="l" for="${id}">${f.l}${f.req ? ' *' : ''}</label>${inner}${f.h ? `<div class="hint">${esc(f.h)}</div>` : ''}</div>`;
  if (f.t === 'textarea') return wrap(`<textarea class="field" id="${id}" style="${f.big ? 'min-height:260px' : ''}">${esc(val)}</textarea>`);
  if (f.t === 'lines') return wrap(`<textarea class="field" id="${id}">${esc(Array.isArray(val) ? val.join('\n') : val)}</textarea>`);
  if (f.t === 'tags') return wrap(`<input class="field" id="${id}" value="${esc(Array.isArray(val) ? val.join(', ') : val)}">`);
  if (f.t === 'number') return wrap(`<input class="field" type="number" id="${id}" value="${esc(val === '' ? 0 : val)}">`);
  if (f.t === 'bool') return wrap(`<select class="field" id="${id}"><option value="1" ${val === true || val === '' ? 'selected' : ''}>Ya</option><option value="0" ${val === false ? 'selected' : ''}>Tidak</option></select>`);
  if (f.t === 'select') return wrap(`<select class="field" id="${id}">${f.o.map(([a, b]) => `<option value="${a}" ${val === a ? 'selected' : ''}>${b}</option>`).join('')}</select>`);
  if (f.t === 'image') return wrap(`<input class="field" id="${id}" value="${esc(val)}" placeholder="https://... atau unggah di bawah"><input type="file" accept="image/*" data-up="${id}" style="margin-top:8px;color:var(--muted)">${val ? `<img class="thumbp" id="${id}_p" src="${esc(val)}" alt="">` : `<img class="thumbp" id="${id}_p" style="display:none" alt="">`}`);
  return wrap(`<input class="field" id="${id}" value="${esc(val)}">`);
}
function readFields(fields) {
  const out = {};
  for (const f of fields) {
    const el = $(`#f_${f.k}`); if (!el) continue; let v = el.value;
    if (f.t === 'number') v = Number(v) || 0; else if (f.t === 'bool') v = v === '1'; else if (f.t === 'lines') v = v.split('\n').map((s) => s.trim()).filter(Boolean);
    else if (f.t === 'tags') v = v.split(',').map((s) => s.trim()).filter(Boolean); else { v = v.trim(); if (v === '' && !f.req) v = null; }
    if (f.req && (v === '' || v == null)) throw new Error(`${f.l} wajib diisi.`);
    out[f.k] = v;
  }
  return out;
}
function bindUploads(folder) {
  document.querySelectorAll('[data-up]').forEach((inp) => inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('Ukuran gambar maksimal 5 MB.', 'err');
    const name = `${folder}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    const { error } = await sb.storage.from('portfolio').upload(name, file, { cacheControl: '31536000', upsert: false });
    if (error) return toast(error.message, 'err');
    const url = sb.storage.from('portfolio').getPublicUrl(name).data.publicUrl; $(`#${inp.dataset.up}`).value = url;
    const pv = $(`#${inp.dataset.up}_p`); pv.src = url; pv.style.display = ''; toast('Gambar terunggah.');
  });
}
function cell(col, v) {
  if (v === true) return '<span class="pill ok">Ya</span>'; if (v === false) return '<span class="pill">Tidak</span>';
  if (col === 'status') return `<span class="pill ${v === 'aktif' ? 'ok' : 'warn'}">${v === 'aktif' ? 'Tersedia' : 'Segera'}</span>`;
  if (col === 'dibuat_pada') return esc(fmtDate(v)); if (Array.isArray(v)) return esc(v.join(', '));
  return `<div class="clip">${esc(v)}</div>`;
}

async function vCrud(table) {
  const cfg = CRUD[table]; const { data, error } = await sb.from(table).select('*').order(cfg.order[0], { ascending: cfg.order[1] }); if (error) throw error;

  $('#add').onclick = () => edit(null);
  document.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => edit(data.find((r) => r.id === b.dataset.e)));

    const { error: er } = await sb.from(table).delete().eq('id', b.dataset.d); if (er) return toast(er.message, 'err'); toast('Terhapus.'); vCrud(table).then(icons); });
}

  $('#srvEye').onclick = (e) => { const i = $('#srvKey'); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; e.target.textContent = s ? 'Sembunyikan' : 'Tampilkan'; };
  $('#srvSave').onclick = async () => { const v = $('#srvKey').value.trim(); if (v.length < 20) return toast('Kunci tampak terlalu pendek.', 'err'); const { error: er } = await sb.rpc('admin_set_secret', { p_key: 'gemini_api_key', p_value: v }); if (er) return toast(er.message, 'err'); $('#srvKey').value = ''; toast('Kunci server tersimpan.'); paintKey(); };
  $('#srvDel').onclick = async () => { if (!await confirmDlg('Hapus kunci server? Pengguna akan diminta memakai kunci sendiri.')) return; const { error: er } = await sb.rpc('admin_set_secret', { p_key: 'gemini_api_key', p_value: '' }); if (er) return toast(er.message, 'err'); toast('Kunci server dihapus.'); paintKey(); };
  $('#srvTest').onclick = async () => { const v = $('#srvKey').value.trim(); if (!v) return toast('Tempel kunci di kolom dulu, lalu uji sebelum disimpan.', 'err'); try { const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', { headers: { 'x-goog-api-key': v } }); toast(r.ok ? 'Kunci berfungsi.' : 'Kunci tidak valid atau belum aktif.', r.ok ? undefined : 'err'); } catch { toast('Tidak bisa terhubung ke Google.', 'err'); } };
  $('#sv').onclick = async () => { const rows = [{ key: 'trial_limit', value: String(Math.max(0, Number($('#s_trial').value) || 0)), publik: true }, { key: 'gemini_model', value: $('#s_model').value.trim(), publik: true }];
    const { error: er } = await sb.from('settings').upsert(rows); if (er) return toast(er.message, 'err'); toast('Pengaturan tersimpan.'); };
}

// ===== mulai =====
setMode('masuk');
const { data: { session } } = await sb.auth.getSession(); if (session) await enter();
icons();
</script>
</body>
</html>
